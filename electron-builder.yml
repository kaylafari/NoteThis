appId: com.cadence.meetingnotes
productName: NoteThis
directories:
  output: release
files:
  - dist/**
  - dist-desktop/**
  - dist-server/**
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - "*.wav"
      - "*.json"
  - from: scripts
    to: scripts
    filter:
      - "*.py"
      - "*.txt"
asar: true
afterSign: scripts/sign-local-mac.cjs
mac:
  icon: assets/notethis.icns
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  notarize: false
  target:
    - target: dir
      arch:
        - arm64
  extendInfo:
    NSMicrophoneUsageDescription: NoteThis records your microphone so your voice is included in your meeting transcript.
    NSAudioCaptureUsageDescription: NoteThis records call audio playing on your computer to transcribe and summarize your meeting.
    NSScreenCaptureUsageDescription: NoteThis accesses system audio from your screen sharing session. It saves audio only.
win:
  target: nsis
linux:
  target: AppImage
  category: Office
